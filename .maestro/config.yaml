# Maestro workspace. Run it with scripts/e2e.sh, never with a bare `maestro test`:
# the script installs the debug build and passes the test account from .env.local.
#
# Every flow lives in a feature folder and is tagged with that feature,
# plus `smoke` when it is one of the few journeys run after every change.
flows:
  - "*/*"
  - "!subflows/*"
