# A guest adds a pizza to the cart and finds it there.
appId: com.example.lazypizza.debug
tags:
  - cart
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Margherita"
    timeout: 15000
- tapOn: "Margherita"
- tapOn: "Add to Cart for .*"
- tapOn: "Cart"
- extendedWaitUntil: # the cart waits for its recommendations, which load from the network
    visible: "Proceed to Checkout.*"
    timeout: 15000
- assertVisible: "Margherita"
