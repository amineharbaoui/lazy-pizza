name: Claude

# Runs Claude Code when a comment or a review on a pull request or an issue mentions @claude,
# for example "@claude review". Only users with write access to the repo can start it.
# Needs the Claude GitHub App on the repo and the CLAUDE_CODE_OAUTH_TOKEN secret, made with `claude setup-token`.
# Comment events run this file as it is on main, so a change to it takes effect once merged.

on:
    issue_comment:
        types: [created]
    pull_request_review_comment:
        types: [created]
    pull_request_review:
        types: [submitted]

permissions:
    contents: write
    pull-requests: write
    issues: write
    id-token: write
    actions: read # Lets Claude read CI results on PRs

jobs:
    claude:
        if: |
            (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
            (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
            (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 1

            - name: Run Claude Code
              uses: anthropics/claude-code-action@v1
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
